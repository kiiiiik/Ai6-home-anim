<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERRAIN / VISUALISATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F3FF;
    --panel-bg: rgba(10, 14, 22, 0.88);
    --panel-border: rgba(91, 123, 255, 0.2);
    --text: #e0e6ff;
    --accent: #5B7BFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; overflow: hidden; }
  /* Scroll sentinel — élément haut pour capter le wheel sans scrollbar visible */
  #canvas { position: fixed; inset: 0; display: block; z-index: 0; }

  /* Fade — haut uniquement */
  #fadeOverlay {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, var(--bg) 0%, transparent 30%);
    opacity: 1;
  }

  /* Bokeh — backdrop-filter masqué */
  #bokehOverlay {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    display: none;
  }
  #annotCanvas { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

  /* Scroll hint */
  #scrollHint {
    position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: 0.25em; color: var(--accent);
    opacity: 0; transition: opacity 0.8s; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  #scrollHint.visible { opacity: 0.7; }
  #scrollHint svg { animation: bounce 1.6s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); z-index: 200; }

  #dot-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 3px;
    width: 32px;
    height: 32px;
  }
  .dot {
    width: 100%; height: 100%;
    background-color: #001DFC;
    border-radius: 50%;
    transition: background-color 0.3s ease, transform 0.3s ease, opacity 0.6s ease;
    will-change: transform, background-color, opacity;
  }
  .dot.ripple {
    background-color: #00FCD9;
    transform: scale(1.2);
    transition: background-color 0.15s ease, transform 0.15s ease;
  }
  .dot.erase { opacity: 0; transform: scale(0.3); }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<canvas id="canvas2" style="position:fixed;inset:0;display:block;z-index:0;opacity:0;pointer-events:none;"></canvas>
<div id="fadeOverlay"></div>
<div id="bokehOverlay"></div>
<canvas id="annotCanvas"></canvas>

<!-- transition gérée par opacité CSS des deux canvas -->
<div id="whiteOverlay" style="position:fixed;inset:0;z-index:5;background:#F2F3FF;opacity:0;pointer-events:none;"></div>

<!-- Scroll hint -->

<div id="loading" class="loading"><div id="dot-grid"></div></div>



<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.0/build/index.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MeshSurfaceSampler } from 'three/addons/math/MeshSurfaceSampler.js';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;

/* ====================== GLTF DECODERS ======================
   Les .glb ont été optimisés (compression Draco pour maisons.glb,
   Meshopt pour terrain.glb / maisons2.glb) — ces décodeurs sont
   nécessaires pour que GLTFLoader puisse les lire. */
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
function makeGLTFLoader() {
  const l = new GLTFLoader();
  l.setDRACOLoader(dracoLoader);
  l.setMeshoptDecoder(MeshoptDecoder);
  return l;
}
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

/* ====================== LOADER ====================== */
const dotGridEl = document.getElementById('dot-grid');
const dots = [];
for (let r = 0; r < 5; r++) {
  for (let c = 0; c < 5; c++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dotGridEl.appendChild(dot);
    dots.push({ element: dot, dist: Math.abs(r - 2) + Math.abs(c - 2) });
  }
}
function runLoaderRipple() {
  dots.forEach(d => d.element.classList.remove('ripple'));
  [{d:0,t:0},{d:1,t:150},{d:2,t:300},{d:3,t:450},{d:4,t:600}].forEach(p => {
    setTimeout(() => {
      const wave = dots.filter(d => d.dist === p.d);
      wave.forEach(d => d.element.classList.add('ripple'));
      setTimeout(() => wave.forEach(d => d.element.classList.remove('ripple')), 250);
    }, p.t);
  });
}
function runLoaderErase() {
  dots.forEach(d => d.element.classList.remove('ripple'));
  [0,1,2,3,4].forEach(dist => {
    setTimeout(() => {
      dots.filter(d => d.dist === dist).forEach(d => d.element.classList.add('erase'));
    }, dist * 150);
  });
}
let loaderInt;
const loaderStartTime = performance.now();
runLoaderRipple();
loaderInt = setInterval(runLoaderRipple, 1500);

/* ====================== SCENE ====================== */
const scene = new THREE.Scene();
const bgColor = new THREE.Color(0xF2F3FF);
scene.background = bgColor;
scene.fog = new THREE.Fog(bgColor, 20.0, 31.0);

// Recul de caméra sur mobile : la scène tient dans un cadre plus étroit (portrait),
// on éloigne la caméra de sa cible pour laisser voir davantage de contenu.
const IS_MOBILE = window.innerWidth <= 768;
const CAM1_TARGET = new THREE.Vector3(-0.2920, 0.2850, 0.2350);
const CAM1_BASE   = new THREE.Vector3(1.6610, 1.7990, 3.0290);
const CAM1_PULLBACK = IS_MOBILE ? 1.35 : 1.0;
const CAM1_START = CAM1_TARGET.clone().add(
  CAM1_BASE.clone().sub(CAM1_TARGET).multiplyScalar(CAM1_PULLBACK)
);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.copy(CAM1_START);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.2920, 0.2850, 0.2350);
controls.enableRotate = false; controls.enableZoom = false; controls.enablePan = false;
controls.enableDamping = true;

const ambientLight = new THREE.AmbientLight(0xffffff, 1.35);
scene.add(ambientLight);
const sun = new THREE.DirectionalLight(0xffffff, 1.85);
sun.position.set(5, 10, 5);
scene.add(sun);
// Position initiale calculée depuis les valeurs par défaut (az=45°, el=63°)
// sera recalculée par updateSunPosition() après init UI

/* ====================== SHADERS ====================== */
const topoUniforms = {
  uColor: { value: new THREE.Color(0x6289FF) },
  uSpacing: { value: 94.0 },
  uLineWidth: { value: 0.1 },
  uReveal: { value: 0.0 },          // 0 = flat, 1 = full terrain
  uTopoRevealDist: { value: 0.0 }   // topo lines draw from cam to back
};
const waveUniforms = {
  uTime: { value: 0 },
  uBaseColor: { value: new THREE.Color(0x0033ff) },
  uWaveColor: { value: new THREE.Color(0x85ffe7) },
  uWaveSpeed: { value: 0.5 },
  uWaveSize: { value: 0.8 },
  uPointSize: { value: 0.005 },
  // Wave origins (up to 3, in parallaxGroup local XZ space)
  uWaveOrigin0: { value: new THREE.Vector2(0, 0) },
  uWaveOrigin1: { value: new THREE.Vector2(0, 0) },
  uWaveOrigin2: { value: new THREE.Vector2(0, 0) },
  uWavePhase0:  { value: 0.0 },
  uWavePhase1:  { value: 2.1 },
  uWavePhase2:  { value: 4.3 },
  uWaveWeight0: { value: 1.0 },  // 1.0 = active, 0.0 = inactive
  uWaveWeight1: { value: 0.0 },
  uWaveWeight2: { value: 0.0 },
  uScreenHeight: { value: window.innerHeight },
  uRevealRadius: { value: -1.0 },   // wave front radius (-1 = nothing visible)
  uRevealOrigin: { value: new THREE.Vector2(0, 0) },  // XZ wave source
  uTerrainReveal: { value: 0.0 },    // synced with topoUniforms.uReveal for Y scaling
  uWaveSizeBoost: { value: 1.5 }     // grossissement des points au passage de l'onde (0 = aucun)
};

const topoMaterial = new THREE.ShaderMaterial({
  uniforms: { ...topoUniforms, ...THREE.UniformsLib['fog'] },
  vertexShader: `
    #include <fog_pars_vertex>
    uniform float uReveal;
    varying float vY;
    varying float vViewDist;
    void main() {
      vec3 pos = position;
      pos.y *= uReveal;
      vY = pos.y;
      vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
      vViewDist = length(mvPosition.xyz);
      gl_Position = projectionMatrix * mvPosition;
      #include <fog_vertex>
    }
  `,
  fragmentShader: `
    #include <fog_pars_fragment>
    uniform vec3 uColor;
    uniform float uSpacing;
    uniform float uLineWidth;
    uniform float uTopoRevealDist;
    varying float vY;
    varying float vViewDist;
    void main() {
      // Draw topo lines progressively from camera outward
      float drawEdge = smoothstep(uTopoRevealDist, uTopoRevealDist - 0.6, vViewDist);
      if (drawEdge < 0.01) discard;
      float coord = vY * uSpacing;
      float fraction = fract(coord);
      float dist = abs(fraction - 0.5);
      float delta = fwidth(coord);
      float line = smoothstep(delta * (uLineWidth + 0.5), delta * (uLineWidth - 0.5), dist);
      if (line < 0.1) discard;
      gl_FragColor = vec4(uColor, line * drawEdge);
      #include <fog_fragment>
    }
  `,
  transparent: true, side: THREE.DoubleSide, extensions: { derivatives: true }
});

/* ====================== ALTITUDE ANNOTATIONS ====================== */
const annotCanvas = document.getElementById('annotCanvas');
annotCanvas.width = window.innerWidth;
annotCanvas.height = window.innerHeight;
const annotCtx = annotCanvas.getContext('2d');
let altitudePoints = [];
let showAltitudes = true;

// Alt mesh local positions extracted at load time (in parallaxGroup space)
let altMeshLocalPositions = [];

// Onde mesh local positions
let ondeMeshLocalPositions = [];
let etiquetteLocalPositions = [];
let etiqAnimStartMs = null;
let etiqCurrentOrder = null;
let etiqCycleStartS  = 0;
let etiqBarData      = null;

let etiq2LocalPositions = [];
let etiq2AnimStartMs  = null;  // horloge unique — même structure que l'étiquette scène 1
let etiq2BarData      = null;

/* ====================== INTRO ANIMATION ====================== */
let introPlaying = false;
let introStart = 0;
let annotReveal = 0;    // 0→1 controls annotation opacity
let hotspotReveal = 0;  // 0→1 controls hotspot opacity

// Camera intro: descend from sky
const CAM_FINAL = CAM1_START.clone();
const CAM_START_Y = 4.6;    // hauteur de départ (réduite — caméra part de moins haut)
const INTRO_DURATION = 5.2; // secondes (alignée sur la fin de la séquence d'apparition)

// Timing des étapes d'apparition (secondes) — repris du back
const I_OVERLAY_OUT   = [0.0,  0.4];  // loading overlay fades out
const I_TERRAIN       = [0.5,  2.5];  // terrain + points montent
const I_TOPO_DRAW     = [1.8,  3.8];  // traits se dessinent cam → fond
const I_BUILDINGS     = [2.4,  4.2];  // maisons fade in
const I_ANNOT         = [2.8,  4.8];  // labels d'altitude — 1s après les lignes topo
const I_HOTSPOT       = [5.5,  6.5];  // hotspot

function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function easeInOut(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function phase(elapsed, start, end) {
  return Math.max(0, Math.min(1, (elapsed - start) / (end - start)));
}

function updateIntro(elapsed) {
  if (!introPlaying) return;

  // Loading overlay fade out
  const loadingEl = document.getElementById('loading');
  const overlayT = phase(elapsed, ...I_OVERLAY_OUT);
  loadingEl.style.opacity = 1 - overlayT;
  if (overlayT >= 1) loadingEl.style.display = 'none';

  // --- Caméra : descend depuis le ciel sur toute l'intro (mouvement conservé) ---
  const camT = easeOut(phase(elapsed, 0.0, INTRO_DURATION));
  camera.position.x = CAM_FINAL.x;
  camera.position.y = CAM_START_Y + (CAM_FINAL.y - CAM_START_Y) * camT;
  camera.position.z = CAM_FINAL.z;

  // --- Terrain + points montent ensemble (Y scaling) ---
  const terrainT = easeOut(phase(elapsed, ...I_TERRAIN));
  topoUniforms.uReveal.value = terrainT;
  waveUniforms.uTerrainReveal.value = terrainT;

  // --- Onde radiale sur les points (démarre légèrement après le terrain, depuis le hotspot) ---
  const pointsT = easeInOut(phase(elapsed, I_TERRAIN[0] + 0.3, I_TERRAIN[1] + 0.4));
  waveUniforms.uRevealRadius.value = pointsT * 12.0 - 0.2;

  // --- Lignes topo se dessinent de la caméra vers le fond ---
  const topoT = easeInOut(phase(elapsed, ...I_TOPO_DRAW));
  topoUniforms.uTopoRevealDist.value = topoT * 15.0;

  // --- Maisons fade in ---
  const buildT = easeOut(phase(elapsed, ...I_BUILDINGS));
  housesGroup.traverse(c => {
    if (c.isMesh && c.material) c.material.opacity = buildT * 1;
  });

  // --- Annotations + hotspot --- (linéaire pour annot pour laisser le stagger respirer)
  annotReveal   = phase(elapsed, ...I_ANNOT);
  hotspotReveal = easeInOut(phase(elapsed, ...I_HOTSPOT));

  // Done — snap to final state
  if (elapsed > INTRO_DURATION) {
    introPlaying = false;
    if (etiqAnimStartMs === null) etiqAnimStartMs = performance.now();
    camera.position.copy(CAM_FINAL);
    topoUniforms.uReveal.value = 1;
    topoUniforms.uTopoRevealDist.value = 15.0;
    waveUniforms.uTerrainReveal.value = 1;
    waveUniforms.uRevealRadius.value = 12.0;
    annotReveal = 1;
    hotspotReveal = 1;
    // Pas de reset de parallaxGroup.rotation — le parallax souris continue sans saut
    housesGroup.traverse(c => { if (c.isMesh && c.material) c.material.opacity = 1; });
  }
}

function startIntro() {
  clearInterval(loaderInt);
  runLoaderErase();
  introPlaying = true;
  introStart = performance.now();
  // État initial : terrain à plat, lignes topo non dessinées, points invisibles
  topoUniforms.uReveal.value = 0;
  topoUniforms.uTopoRevealDist.value = 0;
  waveUniforms.uTerrainReveal.value = 0;
  waveUniforms.uRevealRadius.value = -1.0;
  annotReveal = 0;
  hotspotReveal = 0;
  altitudePoints.forEach(pt => { pt.alpha = 0; pt.lineProgress = 0; });
  // Positionner la caméra en hauteur (mouvement caméra conservé)
  camera.position.set(CAM_FINAL.x, CAM_START_Y, CAM_FINAL.z);
  housesGroup.traverse(c => { if (c.isMesh && c.material) c.material.opacity = 0; });
  // Loading overlay
  const loadingEl = document.getElementById('loading');
  loadingEl.style.display = 'flex';
  loadingEl.style.opacity = '1';
  loadingEl.style.background = 'transparent';
}

/* ====================== SCROLL & TRANSITION ====================== */
// scrollT continu, non borné :
//   0   → 1   : zoom scène 1
//   1   → 1.5 : fade vers blanc (scène 1 disparaît)
//   1.5 → 2.5 : blanc disparaît + scène 2 apparaît + caméra descend (el 80°→30°)
//   ≥ 2.5     : scène 2 stable
let scrollT = 0;
let scrollTSmooth = 0;
const SCROLL_SPEED = 0.003;

const S2_EL_START = 38;  // élévation de départ — encore plus bas, arrivée plus latérale
const S2_AZ_OFFSET = 12; // décalage d'azimut au départ → virage très léger
const S2_ZOOM_START_MUL = 1.6; // multiplicateur de zoom au départ (dézoomé) → zoom à la fin

let scrollCamEnd = new THREE.Vector3();
let scrollTgtEnd = new THREE.Vector3();
let scrollInitialized = false;

function initScrollTargets() {
  const dir = hotspotWorldPos.clone().sub(CAM_FINAL).normalize();
  scrollCamEnd.copy(CAM_FINAL).addScaledVector(dir, 1.8);
  scrollCamEnd.y += 0.6;
  scrollTgtEnd.copy(hotspotWorldPos);
  scrollInitialized = true;
}


// Canvas scène 2 — rendu séparé
const canvas2El = document.getElementById('canvas2');
const renderer2 = new THREE.WebGLRenderer({ canvas: canvas2El, antialias: true });
renderer2.setSize(window.innerWidth, window.innerHeight);
renderer2.setPixelRatio(window.devicePixelRatio);
renderer2.outputColorSpace = THREE.SRGBColorSpace;
renderer2.toneMapping = THREE.ACESFilmicToneMapping;
renderer2.toneMappingExposure = 1.0;

const whiteOverlay = document.getElementById('whiteOverlay');

// Vars de transition
let scene2Loaded = false;
let scene2Loading = false;

window.addEventListener('wheel', e => {
  // Laisser passer le scroll sur les panneaux de contrôle
  if (e.target.closest && e.target.closest('.panel')) return;
  e.preventDefault();
  if (introPlaying) {
    // Pendant l'intro : ignorer le scroll, le remettre à zéro en permanence
    scrollT = 0; scrollTSmooth = 0;
    return;
  }
  const SCROLL_MAX = 4.0; // plafond : scène 2 stabilisée
  scrollT = Math.max(0, Math.min(SCROLL_MAX, scrollT + e.deltaY * SCROLL_SPEED));
}, { passive: false });

let touchStartY = 0;
window.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove', e => {
  const dy = touchStartY - e.touches[0].clientY;
  touchStartY = e.touches[0].clientY;
  if (introPlaying) { scrollT = 0; scrollTSmooth = 0; return; }
  const SCROLL_MAX = 4.0;
  scrollT = Math.max(0, Math.min(SCROLL_MAX, scrollT + dy * SCROLL_SPEED * 2));
}, { passive: true });

// Easing doux pour la descente caméra
function easeInOutQuart(t) { return t < 0.5 ? 8*t*t*t*t : 1 - Math.pow(-2*t+2,4)/2; }

// Appliquer la caméra ortho avec une élévation, un offset d'azimut et un multiplicateur de zoom
function applyOrthoWithEl(elDeg, azOffsetDeg = 0, zoomMul = 1) {
  const zoom = S2_ZOOM_BASE * zoomMul;
  const az   = (45.0 + azOffsetDeg) * Math.PI / 180;
  const el   = elDeg * Math.PI / 180;
  const tx   = -0.01;
  const ty   = 0.0;
  const tz   = 0.0;
  const tgt  = new THREE.Vector3(tx, ty, tz);
  camera2.position.set(
    tgt.x + Math.cos(el) * Math.sin(az) * ORTHO_DIST,
    tgt.y + Math.sin(el) * ORTHO_DIST,
    tgt.z + Math.cos(el) * Math.cos(az) * ORTHO_DIST
  );
  camera2.lookAt(tgt);
  controls2.target.copy(tgt);
  const aspect = window.innerWidth / window.innerHeight;
  camera2.left=-zoom*aspect; camera2.right=zoom*aspect;
  camera2.top=zoom; camera2.bottom=-zoom;
  camera2.updateProjectionMatrix();
}

function updateScrollAndTransition() {
  if (!scrollInitialized || introPlaying) return;

  scrollTSmooth += (scrollT - scrollTSmooth) * 0.07;
  const s = scrollTSmooth;

  // ── Phase 1 : zoom scène 1 — continue au-delà de s=1 pendant le fade ─────
  // s1 va de 0 à 1 sur la plage 0→1, puis continue jusqu'à 1.8 sur 1→1.5
  // (zoom continu et plus prononcé pendant la disparition)
  const s1 = Math.min(s, 1) + Math.max(0, Math.min((s - 1) / 0.5, 1)) * 0.8;
  camera.position.lerpVectors(CAM_FINAL, scrollCamEnd, s1);
  controls.target.lerpVectors(
    new THREE.Vector3(-0.2920, 0.2850, 0.2350), scrollTgtEnd, s1
  );
  // Pas de virage sur la scène 1 — on garde un mouvement pur de zoom
  scrollRotOffset = 0;

  // ── Apparition fluide des annotations au scroll : fade in 0→0.15, fade out 0.7→1 ──
  // (l'intro initiale les a déjà révélées à 1; ici on les fait disparaître progressivement)
  const altFadeOut = 1 - Math.max(0, Math.min((s - 0.4) / 0.5, 1));
  annotReveal = altFadeOut;
  hotspotReveal = altFadeOut;

  // ── Phase 2 : fade vers blanc — démarre plus tôt et plus rapide ─────────
  // La scène 1 commence à disparaître dès s=0.7 et est totalement blanche à s=1.1
  const fadeOut = Math.max(0, Math.min((s - 0.7) / 0.4, 1));

  if (fadeOut > 0 && !scene2Loaded && !scene2Loading) loadScene2();

  // ── Phase 3 : apparition scène 2 + descente caméra (s 1.1→3.5) ───────────
  const fadeIn = Math.max(0, Math.min((s - 1.1) / 2.4, 1));

  // Blanc : monte 0→1 entre s=0.7 et s=1.1, redescend 1→0 entre s=1.1 et s=1.5
  const whiteFadeIn  = s < 0.7 ? 0 : Math.max(0, Math.min((s - 0.7) / 0.4, 1));
  const whiteFadeOut = s < 1.1 ? 1 : Math.max(0, 1 - (s - 1.1) / 0.4);
  const whitePeak = s < 0.7 ? 0 : (s < 1.1 ? whiteFadeIn : whiteFadeOut);
  whiteOverlay.style.opacity = whitePeak;

  // Canvas 1 : disparaît lors du fadeOut
  document.getElementById('canvas').style.opacity = 1 - fadeOut;
  scene2FadeIn = fadeIn;
  // annotCanvas suit exactement l'opacité de canvas2El : max(1-fadeOut, fadeIn)
  // → scène 1 reste visible pendant son fadeOut, scène 2 monte en même temps que sa scène 3D
  annotCanvas.style.opacity = scene2Loaded
    ? Math.max(1 - fadeOut, fadeIn)
    : (1 - fadeOut);

  // Canvas 2 : apparaît lors du fadeIn
  canvas2El.style.opacity = scene2Loaded ? fadeIn : 0;
  canvas2El.style.pointerEvents = 'none';

  // ── Caméra scène 2 : descend + virage azimut + zoom progressif (easing fluide) ──
  if (scene2Loaded) {
    const elTarget  = 30.0;
    // Easing in-out cubic pour un mouvement plus organique
    const eFade = easeInOutQuart(fadeIn);
    const elCurrent  = S2_EL_START + (elTarget - S2_EL_START) * eFade;
    // Virage : azimut décalé au départ, revient à 0 → arc latéral pendant l'arrivée
    const azOffset   = S2_AZ_OFFSET * (1 - eFade);
    // Zoom : commence dézoomé (S2_ZOOM_START_MUL) → cible 1.0
    const zoomMul    = S2_ZOOM_START_MUL + (1 - S2_ZOOM_START_MUL) * eFade;
    applyOrthoWithEl(elCurrent, azOffset, zoomMul);
  }

  // ── Indicateur panneau ────────────────────────────────────────────────────
  const nowScene2 = fadeIn >= 0.5 && scene2Loaded;
  if (nowScene2 !== scene2Active) {
    scene2Active = nowScene2;
    if (scene2Active) {
      if (scanItems2.length && scanAnimStartMs2 === null) {
        scan2Order    = etiqNewShuffle(scanItems2.length); // shuffle complet dès le départ
        scan2OrderIdx = 0;
        activeScanIdx2 = scan2Order[0];
        lastScanIdx2 = null;
        scanAnimStartMs2 = performance.now();
        etiq2LocalPositions = [scanItems2[activeScanIdx2].etiqLocalPos];
      }
    } else {
      scanAnimStartMs2  = null;
      activeScanIdx2    = null;
      etiq2AnimStartMs  = null;
      etiq2BarData      = null;
      scan2Order        = null;
      scan2OrderIdx     = 0;
      scanItems2.forEach(item => { item.uniforms.uRadius.value = 0; });
    }
  }

}

function orthoFrustum(zoom) {
  const aspect = window.innerWidth / window.innerHeight;
  const h = zoom;
  const w = h * aspect;
  return { l: -w, r: w, t: h, b: -h };
}

function updateOrthoCamera() {
  const zoom = S2_ZOOM_BASE;
  const az   = 45.0 * Math.PI / 180;
  const el   = 30.0 * Math.PI / 180;
  const tx   = -0.01;
  const ty   = 0.0;
  const tz   = 0.0;
  const target2 = new THREE.Vector3(tx, ty, tz);

  // Direction depuis angles sphériques
  const dx = Math.cos(el) * Math.sin(az);
  const dy = Math.sin(el);
  const dz = Math.cos(el) * Math.cos(az);
  camera2.position.set(
    target2.x + dx * ORTHO_DIST,
    target2.y + dy * ORTHO_DIST,
    target2.z + dz * ORTHO_DIST
  );
  camera2.lookAt(target2);
  controls2.target.copy(target2);

  // Mettre à jour le frustum selon zoom
  const aspect = window.innerWidth / window.innerHeight;
  camera2.left   = -zoom * aspect;
  camera2.right  =  zoom * aspect;
  camera2.top    =  zoom;
  camera2.bottom = -zoom;
  camera2.updateProjectionMatrix();
}

function regenerateGrid2() {
  if (!terrainCollisionMesh2) return;
  if (pointsObject2) parallaxGroup2.remove(pointsObject2);

  const density = 249;
  const bbox = new THREE.Box3().setFromObject(terrainCollisionMesh2);
  const size = bbox.getSize(new THREE.Vector3());
  const nx = density, nz = Math.round(density * (size.z / size.x));
  const stepX = size.x / nx, stepZ = size.z / nz;
  const positions = [];
  const raycaster = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);

  for (let i = 0; i <= nx; i++) {
    for (let j = 0; j <= nz; j++) {
      const x = bbox.min.x + i * stepX;
      const z = bbox.min.z + j * stepZ;
      raycaster.set(new THREE.Vector3(x, bbox.max.y + 1, z), down);
      const hits = raycaster.intersectObject(terrainCollisionMesh2, true);
      if (hits.length > 0) positions.push(hits[0].point.x, hits[0].point.y, hits[0].point.z);
    }
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

  // Shader sans onde — points + sweep diagonal (bas-gauche → haut-droite)
  pointsObject2 = new THREE.Points(geom, new THREE.ShaderMaterial({
    uniforms: { ...waveUniforms2, ...THREE.UniformsLib['fog'], uTexture: { value: createTex() } },
    vertexShader: `
      #include <fog_pars_vertex>
      uniform float uPointSize;
      uniform float uScreenHeight;
      uniform float uTerrainReveal;
      uniform float uSweepPos;
      uniform float uSweepWidth;
      uniform float uSweepStrength;
      varying float vSweep;
      void main() {
        vec3 pos = position;
        pos.y *= uTerrainReveal;

        // Projection diagonale bas-gauche → haut-droite : direction (1, -1) normalisée
        float proj = (pos.x - pos.z) * 0.7071;
        float d = abs(proj - uSweepPos);
        float sweep = (1.0 - smoothstep(0.0, uSweepWidth, d)) * uSweepStrength;
        vSweep = sweep;

        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        // Léger boost de taille sur la bande (comme scène 1)
        gl_PointSize = uPointSize * (1.0 + sweep * 0.8) * (uScreenHeight / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }
    `,
    fragmentShader: `
      #include <fog_pars_fragment>
      uniform vec3 uBaseColor;
      uniform vec3 uSweepColor;
      uniform sampler2D uTexture;
      varying float vSweep;
      void main() {
        vec4 tex = texture2D(uTexture, gl_PointCoord);
        if (tex.a < 0.1) discard;
        vec3 col = mix(uBaseColor, uSweepColor, clamp(vSweep * 1.4, 0.0, 1.0));
        gl_FragColor = vec4(col, tex.a);
        #include <fog_fragment>
      }
    `,
    transparent: true, depthWrite: false
  }));
  parallaxGroup2.add(pointsObject2);
}

function extractAltMeshes2(terrainScene) {
  const found = [];
  terrainScene.traverse(node => {
    if (/^alt\d*$/i.test(node.name)) {
      node.visible = false;
      if (node.isMesh && node.material) { node.material = node.material.clone(); node.material.visible = false; }
      const wp = new THREE.Vector3();
      node.getWorldPosition(wp);
      const lp = parallaxGroup2.worldToLocal(wp.clone());
      found.push({ localPos: lp, name: node.name });
    }
  });
  found.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  altMeshLocalPositions2 = found.map(f => f.localPos);
}

function pickAltitudePoints2() {
  if (altMeshLocalPositions2.length === 0) return;
  let minY = Infinity, maxY = -Infinity;
  altMeshLocalPositions2.forEach(p => { if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; });
  if (terrainCollisionMesh2) {
    const bbox = new THREE.Box3().setFromObject(terrainCollisionMesh2);
    minY = Math.min(minY, bbox.min.y);
    maxY = Math.max(maxY, bbox.max.y);
  }
  const yRange = maxY - minY || 1;
  const lineHeights = [28, 38, 50, 34, 60, 42, 26, 55, 32, 46, 44, 30];

  altitudePoints2 = altMeshLocalPositions2.map((localP, i) => {
    const worldPos = localP.clone();
    parallaxGroup2.localToWorld(worldPos);
    const baseAlt = ((localP.y - minY) / yRange) * 650 + 180;
    return {
      localPos: localP, worldPos,
      baseAlt,
      phase: (i / altMeshLocalPositions2.length) * Math.PI * 2 + i * 0.37,
      lineH: lineHeights[i % lineHeights.length],
      side: i % 2 === 0 ? 1 : -1
    };
  });
}

function updateAltWorldPositions2() {
  altitudePoints2.forEach(pt => {
    const w = pt.localPos.clone();
    parallaxGroup2.localToWorld(w);
    pt.worldPos.copy(w);
  });
}


function buildScanItem(mesh) {
  mesh.updateMatrixWorld(true);
  parallaxGroup2.updateMatrixWorld(true);

  const DENSITY_TARGET = 200;
  const POINT_SIZE = 11;

  // BBox world du mesh
  const scanBboxWorld = new THREE.Box3().setFromObject(mesh);
  const bMin = scanBboxWorld.min, bMax = scanBboxWorld.max;
  const bSize = scanBboxWorld.getSize(new THREE.Vector3());

  // STEP commun à tous les meshes → densité visuelle constante quelle que soit la taille du mesh
  // scan2RefStep est calculé sur le plus grand mesh avant le premier buildScanItem()
  const positions = [], normals = [], randoms = [];
  const STEP = scan2RefStep !== null
    ? scan2RefStep
    : Math.max(bSize.x, bSize.y, bSize.z) / DENSITY_TARGET;
  const NX = Math.max(2, Math.round(bSize.x / STEP));
  const NY = Math.max(2, Math.round(bSize.y / STEP));
  const NZ = Math.max(2, Math.round(bSize.z / STEP));

  // ── Coque bâtiment — épouse la forme réelle du mesh (toit en pente, murs, emprise) ──
  // Pour chaque colonne (x,z) un rayon vertical descendant donne la hauteur du toit.
  // On construit une COQUE creuse : peau du toit (1 pt/colonne, suit les pentes) +
  // murs (colonnes du périmètre remplies sur toute la hauteur). Pas d'intérieur plein
  // → couvre toutes les faces sans former un bloc opaque dense sur les bâtiments hauts.
  if (mesh.geometry && mesh.geometry.computeBoundsTree && !mesh.geometry.boundsTree) {
    mesh.geometry.computeBoundsTree();
  }
  const _ray = new THREE.Raycaster();
  const _down = new THREE.Vector3(0, -1, 0);
  const _orig = new THREE.Vector3();
  const _rayTop = bMax.y + bSize.y * 0.05; // départ légèrement au-dessus du toit
  const volStart = positions.length;

  // 1) Passe raycast : hauteur du toit par colonne (NaN si hors emprise)
  const roofArr = new Float32Array((NX + 1) * (NZ + 1)).fill(NaN);
  const colIdx = (ix, iz) => ix * (NZ + 1) + iz;
  for (let ix = 0; ix <= NX; ix++) {
    for (let iz = 0; iz <= NZ; iz++) {
      _orig.set(bMin.x + (ix / NX) * bSize.x, _rayTop, bMin.z + (iz / NZ) * bSize.z);
      _ray.set(_orig, _down);
      const hits = _ray.intersectObject(mesh, true);
      if (hits.length) roofArr[colIdx(ix, iz)] = hits[0].point.y;
    }
  }
  const pushPt = (x, y, z) => {
    positions.push(x + (Math.random() - 0.5) * STEP * 0.9,
                   y + (Math.random() - 0.5) * STEP * 0.9,
                   z + (Math.random() - 0.5) * STEP * 0.9);
    normals.push(0, 1, 0);
    randoms.push(Math.random());
  };

  // La coque est légèrement décalée vers l'EXTÉRIEUR du mesh (toit relevé, murs
  // poussés vers l'extérieur) pour rester visible par-dessus les faces opaques du
  // bâtiment (depthTest activé) sans être masquée par elles.
  const OUT = STEP * 1.3;          // décalage latéral des murs
  const UP  = STEP * 0.6;          // relèvement de la peau du toit
  const fcx = (bMin.x + bMax.x) / 2, fcz = (bMin.z + bMax.z) / 2;

  // 2) Peau du toit + murs du périmètre
  for (let ix = 0; ix <= NX; ix++) {
    for (let iz = 0; iz <= NZ; iz++) {
      const roofY = roofArr[colIdx(ix, iz)];
      if (isNaN(roofY)) continue;                 // hors emprise
      const cx = bMin.x + (ix / NX) * bSize.x;
      const cz = bMin.z + (iz / NZ) * bSize.z;
      pushPt(cx, roofY + UP, cz);                   // peau du toit (suit la pente, relevée)

      // colonne du périmètre = bord de grille OU au moins un voisin hors emprise
      const isPerim = ix === 0 || ix === NX || iz === 0 || iz === NZ ||
        isNaN(roofArr[colIdx(ix - 1, iz)]) || isNaN(roofArr[colIdx(ix + 1, iz)]) ||
        isNaN(roofArr[colIdx(ix, iz - 1)]) || isNaN(roofArr[colIdx(ix, iz + 1)]);
      if (isPerim) {                                // mur : remplir du sol au toit, poussé dehors
        let dx = cx - fcx, dz = cz - fcz;
        const dl = Math.hypot(dx, dz) || 1; dx = dx / dl * OUT; dz = dz / dl * OUT;
        for (let y = bMin.y; y < roofY - STEP * 0.5; y += STEP) pushPt(cx + dx, y, cz + dz);
      }
    }
  }

  // Fallback : si le raycast n'a quasi rien produit (mesh non fermé / inattendu),
  // on revient à une coque basée sur la boîte (faces verticales + toit plat).
  const volCount = (positions.length - volStart) / 3;
  if (volCount < (NX + 1) * (NZ + 1) * 0.1) {
    positions.length = volStart; normals.length = volStart; randoms.length = volStart / 3;
    for (let ix = 0; ix <= NX; ix++) {
      for (let iz = 0; iz <= NZ; iz++) {
        const cx = bMin.x + (ix / NX) * bSize.x;
        const cz = bMin.z + (iz / NZ) * bSize.z;
        pushPt(cx, bMax.y, cz);                     // toit plat
        if (ix === 0 || ix === NX || iz === 0 || iz === NZ)
          for (let y = bMin.y; y < bMax.y - STEP * 0.5; y += STEP) pushPt(cx, y, cz);
      }
    }
  }

  // Halo sol — plan unique plat au niveau du sol (pas de couches verticales)
  // scan1 et scan3 : zone au sol un peu plus large que scan2
  const nameLower = (mesh.name || '').toLowerCase();
  const haloSpread = (nameLower.startsWith('scan1') || nameLower.startsWith('scan3')) ? 0.50 : 0.42;
  // marge UNIFORME : même distance au mesh sur les 4 côtés (indépendante de la forme du footprint)
  const haloMargin = haloSpread * (bSize.x + bSize.z) / 2;
  const hxMin = bMin.x - haloMargin;
  const hxMax = bMax.x + haloMargin;
  const hzMin = bMin.z - haloMargin;
  const hzMax = bMax.z + haloMargin;
  const haloSizeX = hxMax - hxMin, haloSizeZ = hzMax - hzMin;
  const STEP_H = STEP * 0.72; // plan sol un peu plus dense → zone au sol plus visible
  const HNX = Math.max(2, Math.round(haloSizeX / STEP_H));
  const HNZ = Math.max(2, Math.round(haloSizeZ / STEP_H));
  for (let ix = 0; ix <= HNX; ix++) {
    for (let iz = 0; iz <= HNZ; iz++) {
      const jx = (Math.random() - 0.5) * STEP * 0.9;
      const jz = (Math.random() - 0.5) * STEP * 0.9;
      const x  = hxMin + (ix / HNX) * haloSizeX + jx;
      const z  = hzMin + (iz / HNZ) * haloSizeZ + jz;
      // exclure le halo sous l'emprise du bâtiment (évite la double densité à la base)
      if (x >= bMin.x && x <= bMax.x && z >= bMin.z && z <= bMax.z) continue;
      positions.push(x, bMin.y, z);
      normals.push(0, 1, 0);
      randoms.push(Math.random());
    }
  }

  // Convertir en espace local parallaxGroup2
  const localPos = [], localNorm = [];
  const tmpV = new THREE.Vector3();
  for (let i = 0; i < positions.length; i += 3) {
    tmpV.set(positions[i], positions[i+1], positions[i+2]);
    parallaxGroup2.worldToLocal(tmpV);
    localPos.push(tmpV.x, tmpV.y, tmpV.z);
    localNorm.push(0, 1, 0);
  }

  // BBox locale
  const scanBbox = new THREE.Box3();
  const bMinL = new THREE.Vector3().copy(bMin); parallaxGroup2.worldToLocal(bMinL);
  const bMaxL = new THREE.Vector3().copy(bMax); parallaxGroup2.worldToLocal(bMaxL);
  scanBbox.expandByPoint(bMinL); scanBbox.expandByPoint(bMaxL);
  // halo plat : la bbox descend juste au niveau du sol du bâtiment, pas plus
  const scanCenter = scanBbox.getCenter(new THREE.Vector3());

  const scanGeom = new THREE.BufferGeometry();
  scanGeom.setAttribute('position', new THREE.Float32BufferAttribute(localPos, 3));
  scanGeom.setAttribute('normal',   new THREE.Float32BufferAttribute(localNorm, 3));
  scanGeom.setAttribute('aRandom',  new THREE.Float32BufferAttribute(randoms, 1));

  const uniforms = {
    uTime:         { value: 0 },
    uRadius:       { value: 0.0 },
    uMaxRadius:    { value: 1.0 },
    uCenter:       { value: new THREE.Vector3() },
    uBandWidth:    { value: 0.15 },
    uPointSize:    { value: POINT_SIZE },
    uBaseAlpha:    { value: 0.0 },
    uBaseColor:    { value: new THREE.Color('#00FCD9') },
    uScanColor:    { value: new THREE.Color('#00FCD9') },
    uScreenHeight: { value: window.innerHeight },
  };

  // Origine de l'onde = centre de la face haute du mesh (espace local)
  {
    const scanTopCenter = new THREE.Vector3(scanCenter.x, scanBbox.max.y, scanCenter.z);
    let topMaxR = 0;
    const tcX = scanTopCenter.x, tcY = scanTopCenter.y, tcZ = scanTopCenter.z;
    for (let i = 0; i < localPos.length; i += 3) {
      const dx = localPos[i]-tcX, dy = localPos[i+1]-tcY, dz = localPos[i+2]-tcZ;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d > topMaxR) topMaxR = d;
    }
    uniforms.uCenter.value.copy(scanTopCenter);
    uniforms.uMaxRadius.value = topMaxR;
  }

  const scanMat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `
      attribute float aRandom;
      uniform float uTime, uRadius;
      uniform vec3 uCenter;
      uniform float uBandWidth;
      uniform float uPointSize, uBaseAlpha;
      uniform float uScreenHeight;
      varying float vAlpha, vIntensity;
      void main() {
        vec3 p = position;

        // ── Wiggle : vibration rapide, fréquence unique par particule ──
        // pFloat bougé pour l'affichage ; seuil calculé sur position ORIGINALE p
        // → les particules vibrent mais ne scintillent pas au passage du front
        vec3 pFloat = p;
        float wSpeed = 1.2 + 0.8 * aRandom;           // 1.2–2.0 Hz par particule
        float w = uTime * wSpeed + aRandom * 6.28318;
        pFloat.x += 0.008 * sin(w);

        // ── Onde sphérique depuis le centre de la face haute ──
        // Rayon 0 = un point au toit → s'étend vers les bords puis vers le bas
        float dist = distance(p, uCenter);
        float d = uRadius - dist;   // >0 si dans l'onde (dist < uRadius)
        float filled = smoothstep(-uBandWidth, uBandWidth, d);
        float crest  = exp(-d * d / (uBandWidth * uBandWidth * 0.5));
        vIntensity = clamp(filled + crest * 0.6, 0.0, 1.0);

        float flicker = 0.9 + 0.1 * sin(uTime * 2.0 + aRandom * 6.28318);
        // Fade global : quand uRadius = 0 toutes les particules sont invisibles,
        // y compris celles du centre qui auraient sinon filled=0.5 et crest=1
        float globalFade = smoothstep(0.0, uBandWidth, uRadius);
        vAlpha = clamp((uBaseAlpha + vIntensity) * flicker * globalFade, 0.0, 1.0);

        // Rendu à la position flottante
        vec4 mvPos = modelViewMatrix * vec4(pFloat, 1.0);
        gl_PointSize = uPointSize * (uScreenHeight / -mvPos.z) * 0.003;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform vec3 uBaseColor, uScanColor;
      varying float vAlpha, vIntensity;
      void main() {
        if (vAlpha < 0.01) discard;
        vec2 uv = gl_PointCoord - vec2(0.5);
        float r = length(uv);
        if (r > 0.5) discard;
        // Dégradé sphérique
        float light = pow(1.0 - r * 2.0, 1.5);
        vec3 col = mix(uBaseColor, uScanColor, vIntensity * vIntensity) * (0.8 + light * 0.6);
        float alpha = vAlpha * smoothstep(0.5, 0.3, r);
        gl_FragColor = vec4(col, alpha);
      }
    `,
    transparent: true, depthWrite: false
  });

  const points = new THREE.Points(scanGeom, scanMat);
  points.frustumCulled = false;
  parallaxGroup2.add(points);

  // Étiquette anchor : sommet de la bounding box en espace local parallaxGroup2
  const topY = Math.max(bMinL.y, bMaxL.y);
  const anchorLocal = new THREE.Vector3((bMinL.x + bMaxL.x) / 2, topY, (bMinL.z + bMaxL.z) / 2);
  const lp = anchorLocal;

  return { name: mesh.name, mesh, points, mat: scanMat, uniforms, etiqLocalPos: { localPos: lp, name: mesh.name } };
}

async function loadScene2() {
  if (scene2Loading || scene2Loaded) return;
  scene2Loading = true;
  const loader2 = makeGLTFLoader();
  const [tData2, mData2] = await Promise.all([
    loader2.loadAsync('terrain2.glb'),
    loader2.loadAsync('maisons2.glb')
  ]);

  const tCol2 = tData2.scene.clone();
  tCol2.traverse(c => { if (c.isMesh) { c.geometry.computeBoundsTree(); c.visible = false; } });
  parallaxGroup2.add(tCol2);
  terrainCollisionMesh2 = tCol2;

  extractAltMeshes2(tData2.scene);

  const bbox2 = new THREE.Box3().setFromObject(tCol2);
  const center2 = new THREE.Vector3();
  bbox2.getCenter(center2);
  waveUniforms2.uRevealOrigin.value.set(center2.x, center2.z);

  // Terrain2 → caché entièrement, le quadrillage de points est généré par regenerateGrid2()
  tData2.scene.traverse(c => {
    if (c.isMesh) c.visible = false;
  });
  parallaxGroup2.add(tData2.scene);

  // Maisons2 → matériaux originaux du GLB
  mData2.scene.traverse(c => {
    if (c.isMesh && c.material) {
      c.material = Array.isArray(c.material)
        ? c.material.map(m => { const n = m.clone(); n.fog = true; return n; })
        : (c.material = c.material.clone(), c.material.fog = true, c.material);
    }
  });
  housesGroup2.add(mData2.scene);

  // ── Détecter et construire tous les meshes scan1/2/3 ──
  parallaxGroup2.updateMatrixWorld(true);
  const scanOrder = ['scan1', 'scan2', 'scan3'];

  // ── Calcul du STEP de référence sur le PLUS GRAND mesh scan ──
  // → tous les meshes partagent le même espacement world-space,
  //   donc un petit mesh reçoit naturellement moins de particules qu'un grand
  {
    let refMaxSide = 0;
    scanOrder.forEach(sn => {
      mData2.scene.traverse(node => {
        if (node.isMesh && node.name.toLowerCase().startsWith(sn)) {
          node.updateMatrixWorld(true);
          const sz = new THREE.Box3().setFromObject(node).getSize(new THREE.Vector3());
          refMaxSide = Math.max(refMaxSide, sz.x, sz.y, sz.z);
        }
      });
    });
    const dtRef = 280; // densité de référence — un peu moins de particules sur les meshs
    scan2RefStep = refMaxSide > 0 ? refMaxSide / dtRef : null;
  }

  scanOrder.forEach(scanName => {
    let found = null;
    mData2.scene.traverse(node => {
      if (!found && node.isMesh && node.name.toLowerCase().startsWith(scanName))
        found = node;
    });
    if (found) {
      found.updateMatrixWorld(true);
      const item = buildScanItem(found);
      scanItems2.push(item);
    }
  });
  if (!scanItems2.length) console.warn('[scan2] no scan meshes found');

  // Plan d'ombres baké — plaqué juste au-dessus du terrain (pour éviter z-fighting)
  // Mode multiply : assombrit naturellement le terrain en dessous tout en laissant les points visibles
  const shadowTex = await new Promise((resolve, reject) => {
    new THREE.TextureLoader().load('ombres.png', resolve, undefined, reject);
  });
  shadowTex.colorSpace = THREE.SRGBColorSpace;
  shadowTex.anisotropy = 8;
  const tBbox = new THREE.Box3().setFromObject(terrainCollisionMesh2);
  const tSize = tBbox.getSize(new THREE.Vector3());
  const tCenter = tBbox.getCenter(new THREE.Vector3());
  const shadowMat = new THREE.MeshBasicMaterial({
    map: shadowTex,
    transparent: true,
    opacity: 0.6,
    blending: THREE.NormalBlending,
    depthWrite: false,
    fog: true
  });
  const shadowGeom = new THREE.PlaneGeometry(tSize.x, tSize.z);
  const shadowMesh = new THREE.Mesh(shadowGeom, shadowMat);
  shadowMesh.rotation.x = -Math.PI / 2;
  shadowMesh.rotation.z = Math.PI / 2; // 90° par défaut
  shadowMesh.position.set(tCenter.x, tBbox.min.y + 0.005, tCenter.z); // juste au-dessus du sol
  shadowMesh.userData.baseCenter = tCenter.clone();
  shadowMesh.userData.baseY = tBbox.min.y + 0.005;
  shadowMesh.renderOrder = 1; // après le terrain, avant les points
  shadowMesh.name = 'shadowPlane2';
  parallaxGroup2.add(shadowMesh);
  scene2ShadowMesh = shadowMesh;
  applyShadowTransform2();
  applyShadowBlend2();

  regenerateGrid2();
  pickAltitudePoints2();
  activateScene2(); // snap to final state
  scene2Loaded = true;
  scene2Loading = false;
}

function extractOndeMeshes(terrainScene) {
  const found = [];
  terrainScene.traverse(node => {
    if (/^onde\d*$/i.test(node.name)) {
      node.visible = false;
      if (node.isMesh && node.material) {
        node.material = node.material.clone();
        node.material.visible = false;
      }
      const wp = new THREE.Vector3();
      node.getWorldPosition(wp);
      const lp = parallaxGroup.worldToLocal(wp.clone());
      found.push({ localPos: lp, name: node.name });
    }
  });
  found.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  ondeMeshLocalPositions = found.map(f => f.localPos);

  // Update uniforms with random phases and XZ origins
  const n = Math.min(ondeMeshLocalPositions.length, 3);
  if (n > 0) {
    const phases = [Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2];
    const origins = [
      ondeMeshLocalPositions[0] || new THREE.Vector3(),
      ondeMeshLocalPositions[1] || new THREE.Vector3(),
      ondeMeshLocalPositions[2] || new THREE.Vector3()
    ];
    waveUniforms.uWaveOrigin0.value.set(origins[0].x, origins[0].z);
    waveUniforms.uWaveOrigin1.value.set(origins[1].x, origins[1].z);
    waveUniforms.uWaveOrigin2.value.set(origins[2].x, origins[2].z);
    waveUniforms.uWavePhase0.value = phases[0];
    waveUniforms.uWavePhase1.value = phases[1];
    waveUniforms.uWavePhase2.value = phases[2];
    waveUniforms.uWaveWeight0.value = n >= 1 ? 1.0 : 0.0;
    waveUniforms.uWaveWeight1.value = n >= 2 ? 1.0 : 0.0;
    waveUniforms.uWaveWeight2.value = n >= 3 ? 1.0 : 0.0;
  }
}

function extractAltMeshes(terrainScene) {
  // Find all meshes whose name starts with "alt" (alt1, alt2, alt3…)
  const found = [];
  terrainScene.traverse(node => {
    if (/^alt\d*$/i.test(node.name)) {
      // Hide the mesh
      node.visible = false;
      if (node.isMesh && node.material) {
        node.material = node.material.clone();
        node.material.visible = false;
      }
      // Get world position then convert to parallaxGroup local space
      const wp = new THREE.Vector3();
      node.getWorldPosition(wp);
      const lp = parallaxGroup.worldToLocal(wp.clone());
      found.push({ localPos: lp, name: node.name });
    }
  });
  // Sort by name (alt1, alt2, …)
  found.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  altMeshLocalPositions = found.map(f => f.localPos);
}

function extractEtiquetteMeshes(gltfScene) {
  gltfScene.traverse(node => {
    if (/^etiquette\d*$/i.test(node.name)) {
      node.visible = false;
      if (node.isMesh && node.material) { node.material = node.material.clone(); node.material.visible = false; }
      const wp = new THREE.Vector3();
      node.getWorldPosition(wp);
      const lp = parallaxGroup.worldToLocal(wp.clone());
      if (etiquetteLocalPositions.every(e => e.name !== node.name))
        etiquetteLocalPositions.push({ localPos: lp, name: node.name });
    }
  });
  etiquetteLocalPositions.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
}

function pickAltitudePoints() {
  if (altMeshLocalPositions.length === 0) return;

  // Determine Y range from terrain bbox for altitude mapping
  let minY = Infinity, maxY = -Infinity;
  altMeshLocalPositions.forEach(p => { if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; });
  // Also sample from collision mesh bounds if available
  if (terrainCollisionMesh) {
    const bbox = new THREE.Box3().setFromObject(terrainCollisionMesh);
    minY = Math.min(minY, bbox.min.y);
    maxY = Math.max(maxY, bbox.max.y);
  }
  const yRange = maxY - minY || 1;

  const lineHeights = [28, 38, 50, 34, 60, 42, 26, 55, 32, 46, 44, 30];

  // Mélanger l'ordre de révélation (stagger pseudo-aléatoire)
  const indices = altMeshLocalPositions.map((_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  altitudePoints = altMeshLocalPositions.map((localP, i) => {
    const worldPos = localP.clone();
    parallaxGroup.localToWorld(worldPos);
    const baseAlt = ((localP.y - minY) / yRange) * 650 + 180;
    return {
      localPos: localP, worldPos,
      baseAlt,
      phase: (i / altMeshLocalPositions.length) * Math.PI * 2 + i * 0.37,
      lineH: lineHeights[i % lineHeights.length],
      side: i % 2 === 0 ? 1 : -1,
      revealOrder: indices.indexOf(i) / Math.max(1, altMeshLocalPositions.length - 1),
      alpha: 0,        // alpha courant interpolé en dehors du draw
      lineProgress: 0, // 0→1 : longueur de la ligne qui grandit
    };
  });
}

function updateAltWorldPositions() {
  altitudePoints.forEach(pt => {
    const w = pt.localPos.clone();
    parallaxGroup.localToWorld(w);
    pt.worldPos.copy(w);
  });
}

function projectToScreen(worldPos) {
  const p = worldPos.clone();
  p.project(camera);
  return {
    x: (p.x * 0.5 + 0.5) * annotCanvas.width,
    y: (-p.y * 0.5 + 0.5) * annotCanvas.height,
    behind: p.z > 1
  };
}

function drawAnnotations(time) {
  if (!showAltitudes || altitudePoints.length === 0) { drawHotspot(time); return; }

  const color = '#5B7BFF';
  const fontSize = 11;
  const speed = 0.30;

  // Délai de départ échelonné : chaque point démarre à un moment différent
  const STAGGER_DELAY = 0.18;
  const FADE_DUR = 0.55;
  const LINE_DUR = 0.4;

  altitudePoints.forEach(pt => {
    const sc = projectToScreen(pt.worldPos);
    if (sc.behind) { pt.alpha = 0; pt.lineProgress = 0; return; }

    // Cible : 1 si annotReveal a dépassé le délai de ce point, 0 sinon
    const startThreshold = pt.revealOrder * STAGGER_DELAY * altitudePoints.length / 2.5;
    const localReveal = Math.max(0, annotReveal - startThreshold / 2.5);

    const targetAlpha = Math.min(localReveal / FADE_DUR, 1);
    const targetLine  = Math.min(localReveal / LINE_DUR,  1);

    // Lerp doux frame par frame — la vitesse de lerp contrôle la fluidité
    pt.alpha        += (targetAlpha - pt.alpha)        * 0.18;
    pt.lineProgress += (targetLine  - pt.lineProgress) * 0.14;

    if (pt.alpha < 0.01) return;

    const x = sc.x, y = sc.y;
    const lh = pt.lineH;
    const s = pt.side;
    const p = pt.lineProgress; // 0→1

    const drift = Math.sin(time * speed + pt.phase) * 3.7
                + Math.sin(time * speed * 0.4 + pt.phase + 1.2) * 1.1;
    const val = pt.baseAlt + drift;
    const label = val.toFixed(1).replace('.', ',');

    annotCtx.globalAlpha = pt.alpha;
    annotCtx.strokeStyle = color;
    annotCtx.fillStyle   = color;
    annotCtx.lineWidth   = 1;
    annotCtx.font = `400 ${fontSize}px 'IBM Plex Mono', monospace`;

    // Point central
    annotCtx.beginPath();
    annotCtx.arc(x, y, 2, 0, Math.PI * 2);
    annotCtx.fill();

    // Ligne verticale qui grandit vers le haut
    const lineTop = y - lh * p;
    annotCtx.beginPath();
    annotCtx.moveTo(x, y - 3);
    annotCtx.lineTo(x, lineTop);
    // Tick horizontal seulement si la ligne est complète (p > 0.85)
    if (p > 0.85) {
      const tickFade = Math.min((p - 0.85) / 0.15, 1);
      annotCtx.globalAlpha = pt.alpha * tickFade;
      annotCtx.lineTo(x + tickLen * s * tickFade, lineTop);
    }
    annotCtx.stroke();

    // Texte : apparaît une fois que la ligne est presque complète
    if (p > 0.9) {
      const textFade = Math.min((p - 0.9) / 0.1, 1);
      annotCtx.globalAlpha = pt.alpha * textFade;
      annotCtx.textAlign = s === 1 ? 'left' : 'right';
      annotCtx.textBaseline = 'middle';

      const textX = x + (tickLen + 4) * s;
      const tw    = annotCtx.measureText(label).width;
      const padX = 5, padY = 3, br = 3;
      const bgX   = s === 1 ? textX - padX : textX - tw - padX;
      const bgY   = lineTop - (fontSize / 2) - padY;

      // Fond blanc arrondi
      annotCtx.fillStyle = 'white';
      annotCtx.beginPath();
      annotCtx.roundRect(bgX, bgY, tw + padX * 2, fontSize + padY * 2, br);
      annotCtx.fill();

      // Texte par-dessus
      annotCtx.fillStyle = color;
      annotCtx.fillText(label, textX, lineTop);
    }
  });

  annotCtx.globalAlpha = 1;
  drawHotspot(time);
}

function easeOutExpo(t)    { return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function easeInExpo(t)     { return t <= 0 ? 0 : Math.pow(2, 10 * t - 10); }
function easeInOutExpo(t)  { return t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20*t-10)/2 : (2-Math.pow(2,-20*t+10))/2; }
function easeInOutQuad(t)  { return t < 0.5 ? 2*t*t : 1-(2-2*t)*(2-2*t)/2; }
function easeOutCubic(t)   { return 1 - Math.pow(1 - t, 3); }

function etiqNewBarHeights(n) {
  return Array.from({length: n}, () => Array.from({length: 5}, () => 1 + Math.floor(Math.random() * 5)));
}

function etiqNewShuffle(n, avoidFirst = -1) {
  const arr = Array.from({length: n}, (_, i) => i);
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  // Prevent the new cycle from starting with the same card as the previous one ended with
  if (avoidFirst >= 0 && arr[0] === avoidFirst && n > 1) {
    const swapIdx = 1 + Math.floor(Math.random() * (n - 1));
    [arr[0], arr[swapIdx]] = [arr[swapIdx], arr[0]];
  }
  return arr;
}

function drawEtiquettes(t) {
  const n = etiquetteLocalPositions.length;
  if (!n || etiqAnimStartMs === null) return;
  const globalElapsed = (performance.now() - etiqAnimStartMs) / 1000;

  const T1  = ETIQ_INTRO_DUR;
  const T2  = T1 + ETIQ_INTRO_DOTS_DUR;
  const T3  = T2  + ETIQ_SWEEP_DUR;
  const T3F = T3  + ETIQ_SWEEP_FADE_DUR;
  const T3A = T3F + ETIQ_CHART_IN_DUR;
  const T3B = T3A + ETIQ_CHART_HOLD_DUR;
  const T3C = T3B + ETIQ_CHART_OUT_DUR;
  const T4  = T3C + ETIQ_CHECK_DUR;
  const T5  = T4 + ETIQ_PAUSE_DUR;
  const T6  = T5 + ETIQ_OUTRO_DUR;
  const cycleDur = n * T6;

  // Init + cycle advance with new random order each round
  if (etiqCurrentOrder === null) {
    etiqCurrentOrder = etiqNewShuffle(n);
    etiqBarData = etiqNewBarHeights(n);
    etiqCycleStartS = 0;
  }
  while (globalElapsed - etiqCycleStartS >= cycleDur) {
    etiqCycleStartS += cycleDur;
    const lastCard = etiqCurrentOrder[etiqCurrentOrder.length - 1];
    etiqCurrentOrder = etiqNewShuffle(n, lastCard);
    etiqBarData = etiqNewBarHeights(n);
  }
  const localElapsed = globalElapsed - etiqCycleStartS;

  etiqCurrentOrder.forEach((originalIdx, slotIdx) => {
    const etiq = etiquetteLocalPositions[originalIdx];
    const worldPos = etiq.localPos.clone();
    parallaxGroup.localToWorld(worldPos);
    const sc = projectToScreen(worldPos);
    if (sc.behind) return;

    const elapsed = localElapsed - slotIdx * T6;
    if (elapsed < 0 || elapsed > T6) return;

    // Intro: card glisse doucement depuis +16px, fondu easeOutCubic
    const introP      = easeOutCubic(Math.min(elapsed / ETIQ_INTRO_DUR, 1));
    const introOffset = (1 - introP) * 16;

    // Outro: fondu + légère descente — easeInOutQuad
    const outroRaw    = elapsed > T5 ? Math.min((elapsed - T5) / ETIQ_OUTRO_DUR, 1) : 0;
    const outroP      = easeInOutQuad(outroRaw);
    const outroOffset = outroP * 6;

    const s  = ETIQ_SCALE;
    const cx = sc.x - (34.22 * s) / 2;
    const yOff = ETIQ_Y_OFFSETS[originalIdx] ?? -60;
    const cy = sc.y - (35.67 * s) / 2 + yOff + introOffset + outroOffset;

    annotCtx.save();
    annotCtx.globalAlpha = introP * (1 - outroP);
    annotCtx.translate(cx, cy);
    annotCtx.scale(s, s);

    annotCtx.fillStyle = '#00FCD9';
    annotCtx.fill(ETIQ_CARD_PATH);

    if (elapsed >= T1) {
      const rippleE   = elapsed - T1;
      const maxDist   = Math.sqrt(8);
      const inRipple  = elapsed < T2;
      const inSweep     = elapsed >= T2  && elapsed < T3;
      const inSweepFade = elapsed >= T3  && elapsed < T3F;
      const inChartIn   = elapsed >= T3F && elapsed < T3A;
      const inChartHld  = elapsed >= T3A && elapsed < T3B;
      const inChartOut  = elapsed >= T3B && elapsed < T3C;
      const inChart     = inChartIn || inChartHld || inChartOut;
      const inCheck     = elapsed >= T3C;
      const sweepHead = inSweep      ? ((elapsed - T2) / ETIQ_SWEEP_DUR) * (ETIQ_LAPS * ETIQ_PERI_LEN)
                      : inSweepFade  ? ETIQ_LAPS * ETIQ_PERI_LEN
                      : -1;
      const bandSize  = inSweep      ? Math.min(5, 1 + Math.floor(Math.min(sweepHead, 4)))
                      : inSweepFade  ? Math.max(0, Math.ceil(5 * (1 - (elapsed - T3) / ETIQ_SWEEP_FADE_DUR)))
                      : 5;
      const checkProgress = inCheck ? Math.min((elapsed - T3C) / ETIQ_CHECK_DUR, 1) : 0;
      const easedCheck    = easeInOutQuad(checkProgress);

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 5; col++) {
          const dist     = Math.sqrt((col - 2) ** 2 + (row - 2) ** 2);
          const dotDelay = inRipple ? (dist / maxDist) * (ETIQ_INTRO_DOTS_DUR * 0.3) : 0;
          const dotA     = inRipple ? Math.min(Math.max((rippleE - dotDelay) / 0.2, 0), 1) : 1;
          if (dotA <= 0) continue;

          let dr = 255, dg = 255, db = 255, da = dotA;

          if ((inSweep || inSweepFade) && sweepHead >= 0 && bandSize > 0) {
            const pi = ETIQ_PERIMETER.findIndex(([pc, pr]) => pc === col && pr === row);
            if (pi !== -1) {
              const head   = sweepHead % ETIQ_PERI_LEN;
              const behind = (head - pi + ETIQ_PERI_LEN) % ETIQ_PERI_LEN;
              if (behind < bandSize) { dr = 0; dg = 29; db = 252; da = 1; }
            }
          } else if (inChart) {
            const barH = etiqBarData ? etiqBarData[slotIdx][col] : 3;
            let dotsLit;
            if (inChartIn) {
              const e = elapsed - T3F;
              const colP = easeOutCubic(Math.max(0, Math.min((e - col * 0.06) / 0.26, 1)));
              dotsLit = Math.floor(colP * barH);
            } else if (inChartHld) {
              dotsLit = barH;
            } else {
              const e = elapsed - T3B;
              const p = easeInOutQuad(e / ETIQ_CHART_OUT_DUR);
              dotsLit = Math.max(0, Math.round((1 - p) * barH));
            }
            if (4 - row < dotsLit) { dr = 0; dg = 29; db = 252; }
          } else if (inCheck) {
            const ci = ETIQ_CHECK.findIndex(([cc, cr]) => cc === col && cr === row);
            if (ci !== -1 && easedCheck > ci / ETIQ_CHECK.length) { dr = 0; dg = 29; db = 252; }
          }

          annotCtx.fillStyle = `rgba(${dr},${dg},${db},${da.toFixed(2)})`;
          annotCtx.beginPath();
          annotCtx.arc(ETIQ_DOT_X[col], ETIQ_DOT_Y[row], ETIQ_DOT_R, 0, Math.PI * 2);
          annotCtx.fill();
        }
      }
    }

    annotCtx.restore();
    annotCtx.globalAlpha = 1;
  });
}

/* ====================== BOKEH (CSS backdrop-filter) ====================== */
const bokehOverlay = document.getElementById('bokehOverlay');
let bokehEnabled = true;
let focusX = 46.328125, focusY = 63.92552366175329; // % position

function updateBokeh() {
  const isMobile = window.innerWidth <= 768;
  if (!bokehEnabled || isMobile) { bokehOverlay.style.display = 'none'; return; }
  const blur = 30;
  const radius = 59;
  const softness = 25;
  const inner = Math.max(0, radius - softness * 0.5);
  const outer = radius + softness * 0.5;
  const rx = outer;
  const ry = outer * (window.innerWidth / window.innerHeight);

  const mask = `radial-gradient(ellipse ${rx}% ${ry}% at ${focusX}% ${focusY}%, transparent ${inner}%, black ${outer}%)`;
  bokehOverlay.style.display = 'block';
  bokehOverlay.style.backdropFilter = `blur(${blur}px)`;
  bokehOverlay.style.webkitBackdropFilter = `blur(${blur}px)`;
  bokehOverlay.style.webkitMaskImage = mask;
  bokehOverlay.style.maskImage = mask;
}


// (hotspot supprimé — scroll-driven zoom)
let terrainCollisionMesh, pointsObject;
const housesGroup = new THREE.Group();
const parallaxGroup = new THREE.Group();
scene.add(parallaxGroup);
parallaxGroup.add(housesGroup);

function updateHouses() {
  const color = new THREE.Color('#b3c6ff');
  const alpha = 1;
  housesGroup.traverse(c => {
    if (c.isMesh) {
      c.material = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: alpha, fog: true });
    }
  });
}

function regenerateGrid() {
  if (!terrainCollisionMesh) return;
  if (pointsObject) parallaxGroup.remove(pointsObject);

  const density = 202;
  const bbox = new THREE.Box3().setFromObject(terrainCollisionMesh);
  const size = bbox.getSize(new THREE.Vector3());
  const nx = density, nz = Math.round(density * (size.z / size.x));
  const stepX = size.x / nx, stepZ = size.z / nz;
  const positions = [];
  const raycaster = new THREE.Raycaster();
  const down = new THREE.Vector3(0, -1, 0);

  for (let i = 0; i <= nx; i++) {
    for (let j = 0; j <= nz; j++) {
      const x = bbox.min.x + i * stepX;
      const z = bbox.min.z + j * stepZ;
      raycaster.set(new THREE.Vector3(x, bbox.max.y + 1, z), down);
      const hits = raycaster.intersectObject(terrainCollisionMesh, true);
      if (hits.length > 0) positions.push(hits[0].point.x, hits[0].point.y, hits[0].point.z);
    }
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  pointsObject = new THREE.Points(geom, new THREE.ShaderMaterial({
    uniforms: { ...waveUniforms, ...THREE.UniformsLib['fog'], uTexture: { value: createTex() } },
    vertexShader: `
      #include <fog_pars_vertex>
      uniform float uTime; uniform float uWaveSpeed; uniform float uWaveSize; uniform float uPointSize;
      uniform vec2 uWaveOrigin0; uniform vec2 uWaveOrigin1; uniform vec2 uWaveOrigin2;
      uniform float uWavePhase0; uniform float uWavePhase1; uniform float uWavePhase2;
      uniform float uWaveWeight0; uniform float uWaveWeight1; uniform float uWaveWeight2;
      uniform float uScreenHeight;
      uniform float uRevealRadius;
      uniform vec2  uRevealOrigin;
      uniform float uTerrainReveal;
      uniform float uWaveSizeBoost;
      varying float vWave;
      varying float vAlpha;
      void main() {
        vec3 pos = position;
        pos.y *= uTerrainReveal;
        float t = uTime * uWaveSpeed * 3.0;
        float totalW = uWaveWeight0 + uWaveWeight1 + uWaveWeight2;
        float w = 0.0;
        w += uWaveWeight0 * sin(distance(pos.xz, uWaveOrigin0) * uWaveSize - t + uWavePhase0);
        w += uWaveWeight1 * sin(distance(pos.xz, uWaveOrigin1) * uWaveSize - t + uWavePhase1);
        w += uWaveWeight2 * sin(distance(pos.xz, uWaveOrigin2) * uWaveSize - t + uWavePhase2);
        w /= max(totalW, 1.0);
        vWave = smoothstep(0.3, 1.0, w);
        // Radial wave-reveal: points appear as wave front sweeps outward
        float d = distance(pos.xz, uRevealOrigin);
        vAlpha = smoothstep(0.0, 0.35, uRevealRadius - d);
        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
        // Taille proportionnelle à la hauteur réelle de l'écran, grossissement au passage de l'onde
        float sizeMultiplier = 1.0 + uWaveSizeBoost * vWave;
        gl_PointSize = uPointSize * sizeMultiplier * (uScreenHeight / -mvPosition.z);
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }
    `,
    fragmentShader: `
      #include <fog_pars_fragment>
      uniform vec3 uBaseColor; uniform vec3 uWaveColor; uniform sampler2D uTexture;
      varying float vWave;
      varying float vAlpha;
      void main() {
        vec3 color = mix(uBaseColor, uWaveColor, vWave);
        vec4 tex = texture2D(uTexture, gl_PointCoord);
        if (tex.a < 0.1) discard;
        gl_FragColor = vec4(color, tex.a * vAlpha);
        #include <fog_fragment>
      }
    `,
    transparent: true, depthWrite: false
  }));
  parallaxGroup.add(pointsObject);
  pickAltitudePoints();
}

function createTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.beginPath(); x.arc(32, 32, 30, 0, Math.PI * 2); x.fill();
  return new THREE.CanvasTexture(c);
}

async function load() {
  const loader = makeGLTFLoader();
  const [tData, mData] = await Promise.all([
    loader.loadAsync('terrain.glb'),
    loader.loadAsync('maisons.glb')
  ]);

  const tCol = tData.scene.clone();
  tCol.traverse(c => { if (c.isMesh) { c.geometry.computeBoundsTree(); c.visible = false; } });
  parallaxGroup.add(tCol);
  terrainCollisionMesh = tCol;

  // Extract & hide alt* and onde* meshes BEFORE applying topo material
  extractAltMeshes(tData.scene);
  extractEtiquetteMeshes(tData.scene);
  extractEtiquetteMeshes(mData.scene);
  extractOndeMeshes(tData.scene);
  detectHotspot(tData.scene);
  detectHotspot(mData.scene);

  tData.scene.traverse(c => {
    if (c.isMesh && c.visible !== false) c.material = topoMaterial;
  });
  parallaxGroup.add(tData.scene);
  housesGroup.add(mData.scene);
  initHotspotFallback(housesGroup);
  // Set wave reveal origin AND wave origins to hotspot XZ position
  if (hotspotLocalPos) {
    const hx = hotspotLocalPos.x, hz = hotspotLocalPos.z;
    waveUniforms.uRevealOrigin.value.set(hx, hz);
    waveUniforms.uWaveOrigin0.value.set(hx, hz);
    waveUniforms.uWaveOrigin1.value.set(hx, hz);
    waveUniforms.uWaveOrigin2.value.set(hx, hz);
    waveUniforms.uWaveWeight0.value = 1.0;
    waveUniforms.uWaveWeight1.value = 0.0;
    waveUniforms.uWaveWeight2.value = 0.0;
  }

  updateHouses();
  updateFade();
  updateBokeh();
  updateSunPosition();
  updateSunPosition2();
  regenerateGrid();
  // Init scroll targets maintenant — hotspot est déjà connu
  updateHotspotWorldPos();
  initScrollTargets();
  const elapsed = performance.now() - loaderStartTime;
  if (elapsed < 2000) await new Promise(r => setTimeout(r, 2000 - elapsed));
  startIntro();
}

// ── Onde de sol ──
const sweepCfg = { range: 8.0, cycle: 7.0 };

/* ====================== ANIMATION ====================== */
let mx = 0, my = 0;
window.addEventListener('mousemove', e => {
  mx = (e.clientX / window.innerWidth - 0.5) * 0.4;
  my = (e.clientY / window.innerHeight - 0.5) * 0.4;
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  annotCtx.clearRect(0, 0, annotCanvas.width, annotCanvas.height);

  // ===== SCÈNE 1 — toujours rendue sur renderer principal =====
  waveUniforms.uTime.value = t;
  parallaxGroup.rotation.y += (mx * 0.12 + scrollRotOffset - parallaxGroup.rotation.y) * 0.1;
  parallaxGroup.rotation.x += (my * 0.12 - parallaxGroup.rotation.x) * 0.1;
  controls.update();
  renderer.render(scene, camera);

  if (introPlaying) {
    updateIntro((performance.now() - introStart) / 1000);
    updateAltWorldPositions();
    drawAnnotations(t);
    drawEtiquettes(t);
  } else {
    updateScrollAndTransition();
    updateHotspotWorldPos();
    updateAltWorldPositions();
    // Annotations scène 1 : seulement si scène 2 n'est pas encore visible
    if (!scene2Active && scene2FadeIn <= 0.01) { drawAnnotations(t); drawEtiquettes(t); }
  }

  // ===== SCÈNE 2 — rendue sur renderer2 quand chargée =====
  if (scene2Loaded) {
    waveUniforms2.uTime.value = t;
    // Onde diagonale bas-gauche → haut-droite : oscille en boucle.
    const sweepCycle = sweepCfg.cycle;
    const sweepRange = sweepCfg.range;
    const phase = ((t % sweepCycle) / sweepCycle);
    waveUniforms2.uSweepPos.value = -sweepRange / 2 + phase * sweepRange;
    if (scanItems2.length && activeScanIdx2 !== null) {
      const item = scanItems2[activeScanIdx2];
      item.uniforms.uTime.value = t;

      if (scanAnimStartMs2 !== null) {
        const elapsed = (performance.now() - scanAnimStartMs2) / 1000;
        const TRAVEL = scan2Speed;
        const PULSE  = 0.35;
        const maxR   = item.uniforms.uMaxRadius.value;

        if (elapsed < TRAVEL) {
          item.uniforms.uRadius.value = maxR * easeInOutQuad(elapsed / TRAVEL);
        } else if (elapsed < TRAVEL + PULSE) {
          const pt = (elapsed - TRAVEL) / PULSE;
          item.uniforms.uRadius.value = maxR * (1.0 + 0.18 * Math.sin(pt * Math.PI));
        } else if (elapsed < 2 * TRAVEL + PULSE) {
          const u = easeInOutQuad((elapsed - TRAVEL - PULSE) / TRAVEL);
          item.uniforms.uRadius.value = maxR * (1.0 - u);
        } else {
          item.uniforms.uRadius.value = 0;
        }
        // Étiquette démarre 0.3s après le début du scan (même logique que scène 1)
        if (elapsed >= 0.3 && etiq2AnimStartMs === null && etiq2LocalPositions.length > 0) {
          etiq2AnimStartMs = performance.now();
          etiq2BarData = etiqNewBarHeights(1);
        }
      } else {
        item.uniforms.uRadius.value = 0;
      }

      // Boucle : T6 de l'étiquette terminé → prochain scan (sans répétition)
      if (etiq2AnimStartMs !== null) {
        const _T1 = ETIQ_INTRO_DUR;
        const _T2 = _T1 + ETIQ_INTRO_DOTS_DUR;
        const _T3 = _T2 + ETIQ2_SWEEP_DUR;
        const _T3F = _T3 + ETIQ_SWEEP_FADE_DUR;
        const _T3A = _T3F + ETIQ_CHART_IN_DUR;
        const _T3B = _T3A + ETIQ_CHART_HOLD_DUR;
        const _T3C = _T3B + ETIQ_CHART_OUT_DUR;
        const _T4  = _T3C + ETIQ_CHECK_DUR;
        const _T5  = _T4  + ETIQ_PAUSE_DUR;
        const _T6  = _T5  + ETIQ_OUTRO_DUR;
        if ((performance.now() - etiq2AnimStartMs) / 1000 >= _T6) {
          etiq2AnimStartMs = null;
          etiq2BarData     = null;
          lastScanIdx2  = activeScanIdx2;
          scan2OrderIdx++;
          if (!scan2Order || scan2OrderIdx >= scan2Order.length) {
            // Cycle terminé : nouveau shuffle en évitant de démarrer par le dernier joué
            scan2Order    = etiqNewShuffle(scanItems2.length, lastScanIdx2);
            scan2OrderIdx = 0;
          }
          activeScanIdx2 = scan2Order[scan2OrderIdx];
          etiq2LocalPositions = [scanItems2[activeScanIdx2].etiqLocalPos];
          scanAnimStartMs2 = performance.now();
        }
      }
    }
    parallaxGroup2.rotation.y += (mx * 0.14 - parallaxGroup2.rotation.y) * 0.08;
    parallaxGroup2.rotation.x += (my * 0.10 - parallaxGroup2.rotation.x) * 0.08;
    renderer2.render(scene2, camera2);
    // Étiquette scène 2 : active dès que la scène commence à apparaître
    if (scene2FadeIn > 0.01) drawEtiquettes2(t);
  }
}

load(); animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer2.setSize(window.innerWidth, window.innerHeight);
  waveUniforms.uScreenHeight.value = window.innerHeight;
  waveUniforms2.uScreenHeight.value = window.innerHeight;
  annotCanvas.width = window.innerWidth;
  annotCanvas.height = window.innerHeight;
  updateOrthoCamera();
  if (bokehEnabled) updateBokeh();
});
</script>
